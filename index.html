<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sthalika – Abode of Serenity</title>
    <script>
      // More robust fix for window.fetch overwrite attempts
      (function() {
        var originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return originalFetch; },
            set: function(value) {
              console.warn('Blocking attempt to overwrite window.fetch to prevent crash.');
              // We just don't set it.
            }
          });
        } catch (e) {
          // If we can't define property, we can't do much, but at least we tried.
          console.error('Failed to lock window.fetch:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
